name: Tests
on:
    pull_request: {}
    push:
        branches: [familychat]
    workflow_call:
        inputs:
            disable_coverage:
                type: boolean
                required: false
                description: "Specify true to skip generating and uploading coverage for tests"
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

env:
    ENABLE_COVERAGE: ${{ inputs.disable_coverage != 'true' }}
    NX_DEFAULT_OUTPUT_STYLE: stream-without-prefixes

permissions: {}

jobs:
    vitest:
        name: Vitest ${{ format('{0}/{1}', matrix.runner, strategy.job-total) }}
        strategy:
            fail-fast: false
            matrix:
                # Run multiple instances in parallel to speed up the tests
                runner: [1, 2, 3]
        runs-on: ubuntu-24.04
        steps:
            # Dump the disk usage before we start: this job frequently flakes with "No space left on device"
            # so, with the one at the end too, this will let us work out how much disk has been used.
            - name: dfbefore
              run: df -h && df -i

            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: pnpm cache
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .node-version
                  cache: "pnpm"

            # matrix-js-sdk is pinned to a released version in this fork, so upstream's
            # scripts/layered.sh (which links a js-sdk checkout) does not apply.
            - name: Install Deps
              run: pnpm install --frozen-lockfile

            - name: Setup playwright
              uses: ./.github/actions/setup-playwright
              with:
                  write-cache: "true"

            - name: Run tests
              run: pnpm test:unit --coverage=$ENABLE_COVERAGE --shard "$SHARD" --reporter=blob --reporter=github-actions --reporter=dot
              env:
                  SHARD: ${{ format('{0}/{1}', matrix.runner, strategy.job-total) }}

            # Dump the disk usage on failure, because this job seems to fail with disk fills sometimes
            - name: df
              run: df -h && df -i
              if: ${{ failure() }}

            - name: Upload Coverage
              if: env.ENABLE_COVERAGE == 'true'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: coverage-vitest-${{ matrix.runner }}
                  path: |
                      ./coverage
                      !./coverage/lcov-report

            - name: Upload Blob
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: vitest-blob-${{ matrix.runner }}
                  include-hidden-files: true
                  path: |
                      ./.vitest

            - name: Upload vis results
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: vis-results-${{ matrix.runner }}
                  # Only used for the stale-screenshot check
                  path: packages/shared-components/__vis__/linux/__results__
                  if-no-files-found: ignore

    complete:
        name: Tests
        needs:
            - vitest
        if: always()
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            pull-requests: read
            checks: write
            statuses: write
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0 # Full history, fastest for diff-cover

            - name: Download coverage artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              if: needs.vitest.result == 'success' && env.ENABLE_COVERAGE == 'true'
              with:
                  pattern: coverage-*
                  path: coverage

            - name: Diff Coverage
              id: coverage
              if: needs.vitest.result == 'success' && env.ENABLE_COVERAGE == 'true'
              uses: Affanmir/diff-cover-action@a35ea05c1c458490473f6fc2233737e809678273 # v2.1.1
              with:
                  compare-branch: origin/${{ github.base_ref || 'familychat' }}
                  mode: coverage
                  coverage-files: coverage/*/*lcov.info
                  ignore-whitespace: true
                  show-uncovered: true
                  post-comment: false
                  create-annotations: true
                  annotation-type: warning
                  fail-on-threshold: ${{ contains(github.event.pull_request.labels.*.name, 'Z-Skip-Coverage') && 'false' || 'true' }}
                  fail-under: 80

            - name: Download vitest blobs
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  pattern: vitest-blob-*
                  merge-multiple: true
                  path: .vitest

            - name: Download vis results
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  pattern: vis-results-*
                  merge-multiple: true
                  path: packages/shared-components/__vis__/linux/__results__

            - name: Detect stale screenshots
              working-directory: packages/shared-components/__vis__/linux
              run: |
                  if diff -rq __baselines__ __results__ | grep "^Only in __baselines__"; then
                      exit 1
                  fi

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: pnpm cache
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .node-version
                  cache: "pnpm"

            - name: Install Deps
              run: pnpm install --frozen-lockfile

            - run: pnpm vitest --merge-reports --reporter=html

            - name: Upload HTML report
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: vitest-html-report
                  include-hidden-files: true
                  path: |
                      ./.vitest

            - name: Check status of tests
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
