name: Build
on:
    pull_request: {}
    push:
        branches: [familychat]
    workflow_call: {}
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
    NX_DEFAULT_OUTPUT_STYLE: stream-without-prefixes
permissions: {} # No permissions required
jobs:
    build:
        name: "Build on ${{ matrix.image }}"
        # Upstream builds on all 3 platforms to catch OS-specific build breakage. We only build on
        # Linux, which is what we deploy from; see unicornops/family-chat#235.
        strategy:
            fail-fast: false
            matrix:
                image:
                    - ubuntu-24.04
        runs-on: ${{ matrix.image }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  cache: "pnpm"
                  node-version-file: .node-version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Copy config
              working-directory: apps/web
              run: cp familychat/config.json config.json

            - name: Build
              working-directory: apps/web
              env:
                  CI_PACKAGE: true
              # matrix-js-sdk is pinned to a released version in this fork, so upstream's
              # get-version-from-git.sh (which rev-parses a js-sdk checkout) does not apply.
              run: |
                  VERSION="$(node -p 'require("./package.json").version')-$(git rev-parse --short=12 HEAD)"
                  VERSION="$VERSION" pnpm run build

            - name: Upload Artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: webapp
                  path: apps/web/webapp
                  retention-days: 7
