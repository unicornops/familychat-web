# Builds an UNSIGNED Family Chat Desktop package for Linux (tar.gz + deb).
#
# Upstream builds inside a container image published to element-hq's GHCR (so native modules link
# against an older glibc) and signs everything. We build on the runner and sign nothing. Encrypted
# search comes from the prebuilt `@matrix-org/seshat` binaries that `pnpm install` fetches.
#
# Release builds (signed macOS and Windows, Linux, GitHub Releases) are release.yml, see
# docs/RELEASING.md; the update feed is still to do there.
name: Build Desktop (Linux, unsigned)
on:
    pull_request: {}
    push:
        branches: [familychat]
    workflow_dispatch: {}
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
    NX_DEFAULT_OUTPUT_STYLE: stream-without-prefixes
permissions: {} # No permissions required
jobs:
    build:
        name: Build Linux amd64 (unsigned)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  cache: "pnpm"
                  node-version-file: apps/desktop/.node-version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build the web app
              working-directory: apps/web
              env:
                  CI_PACKAGE: true
              run: |
                  cp familychat/config.json config.json
                  VERSION="$(node -p 'require("./package.json").version')-$(git rev-parse --short=12 HEAD)"
                  VERSION="$VERSION" pnpm run build

            - name: Pack the web app into webapp.asar
              working-directory: apps/desktop
              run: |
                  cp -r ../web/webapp ./webapp
                  pnpm run asar-webapp

            - name: Build the Linux package
              working-directory: apps/desktop
              env:
                  VARIANT_PATH: familychat/build.json
                  # Workaround for https://github.com/electron-userland/electron-builder/issues/5721
                  USE_HARD_LINKS: false
              run: |
                  # No `--` after `build`: the package.json script is `nx build --`, so an extra
                  # separator leaves electron-builder invoked as `electron-builder -- -l ...` and
                  # yargs drops everything after `--` into argv._ — the flags below, `--publish
                  # never` included, are then silently ignored.
                  pnpm run build -l tar.gz deb --publish never

            - name: Assert the artifacts are branded Family Chat
              working-directory: apps/desktop
              run: |
                  set -ex
                  test -f ./dist/familychat_*_amd64.deb
                  test -f ./dist/familychat-*.tar.gz
                  dpkg-deb --field ./dist/familychat_*_amd64.deb Package | grep -qx familychat
                  dpkg-deb --fsys-tarfile ./dist/familychat_*_amd64.deb | tar -t | grep -q 'opt/Family-Chat/familychat$'
                  tar -tf ./dist/familychat-*.tar.gz | grep -q '/familychat$'

            - name: Assert encrypted search (seshat) is packaged and loads on our oldest glibc
              working-directory: apps/desktop
              env:
                  # The deb pre-depends on libc6 >= 2.35 (Ubuntu 22.04).
                  MAX_GLIBC: "2.35"
              run: |
                  set -e
                  shopt -s globstar nullglob
                  found=0
                  for filename in dist/linux-unpacked/**/seshat*/**/*.node; do
                      ./scripts/glibc-check.sh "$filename"
                      found=1
                  done
                  test "$found" = 1

            - name: Upload Artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: familychat-desktop-linux-amd64-unsigned
                  path: |
                      apps/desktop/dist/*.tar.gz
                      apps/desktop/dist/*.deb
                  retention-days: 7
