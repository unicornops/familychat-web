# Builds an UNSIGNED Family Chat Desktop package for Linux (tar.gz + deb).
#
# Upstream's desktop pipeline builds the native modules (matrix-seshat for encrypted search,
# sqlcipher for secure storage) inside a bespoke container image published to element-hq's GHCR,
# and signs everything. We have neither, so this workflow deliberately skips `pnpm run hak` and
# produces an unsigned package without those two optional features.
#
# macOS and Windows builds, code signing and the update feed are tracked in
# unicornops/family-chat#235 §8.
name: Build Desktop (Linux, unsigned)
on:
    pull_request: {}
    push:
        branches: [familychat]
    workflow_dispatch: {}
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
    NX_DEFAULT_OUTPUT_STYLE: stream-without-prefixes
permissions: {} # No permissions required
jobs:
    build:
        name: Build Linux amd64 (unsigned)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  cache: "pnpm"
                  node-version-file: apps/desktop/.node-version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build the web app
              working-directory: apps/web
              env:
                  CI_PACKAGE: true
              run: |
                  cp familychat/config.json config.json
                  VERSION="$(node -p 'require("./package.json").version')-$(git rev-parse --short=12 HEAD)"
                  VERSION="$VERSION" pnpm run build

            - name: Pack the web app into webapp.asar
              working-directory: apps/desktop
              run: |
                  cp -r ../web/webapp ./webapp
                  pnpm run asar-webapp

            - name: Build the Linux package
              working-directory: apps/desktop
              env:
                  VARIANT_PATH: familychat/build.json
                  # Workaround for https://github.com/electron-userland/electron-builder/issues/5721
                  USE_HARD_LINKS: false
              run: |
                  # No native modules: electron-builder still expects the directory to exist.
                  mkdir -p .hak/hakModules
                  # No `--` after `build`: the package.json script is `nx build --`, so an extra
                  # separator leaves electron-builder invoked as `electron-builder -- -l ...` and
                  # yargs drops everything after `--` into argv._ — the flags below, `--publish
                  # never` included, are then silently ignored.
                  pnpm run build -l tar.gz deb --publish never

            - name: Assert the artifacts are branded Family Chat
              working-directory: apps/desktop
              run: |
                  set -ex
                  test -f ./dist/familychat_*_amd64.deb
                  test -f ./dist/familychat-*.tar.gz
                  dpkg-deb --field ./dist/familychat_*_amd64.deb Package | grep -qx familychat
                  dpkg-deb --fsys-tarfile ./dist/familychat_*_amd64.deb | tar -t | grep -q 'opt/Family-Chat/familychat$'
                  tar -tf ./dist/familychat-*.tar.gz | grep -q '/familychat$'

            - name: Upload Artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: familychat-desktop-linux-amd64-unsigned
                  path: |
                      apps/desktop/dist/*.tar.gz
                      apps/desktop/dist/*.deb
                  retention-days: 7
