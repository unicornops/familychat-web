name: Conventional Commits
on:
    pull_request:
        types: [opened, edited, reopened, synchronize]
permissions: {}
jobs:
    conventional_commits:
        name: Conventional Commit PR title
        runs-on: ubuntu-24.04
        permissions:
            pull-requests: read
        steps:
            # Upstream used `pull_request.yaml` to apply Element's release-drafter changelog
            # labels and to run element-hq's community-PR labeller, both of which need
            # ELEMENT_BOT_TOKEN and Element's label set. We check the PR title parses as a
            # Conventional Commit instead (unicornops/family-chat#235 §1); we squash-merge, so
            # the PR title becomes the commit subject.
            #
            # `pull_request` rather than upstream's `pull_request_target`: the title is in the
            # event payload, so there is no reason to run privileged against the base branch.
            - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
